<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="EstilosLogin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <div>
            <img src="/logolisto-removebg-preview.png" class="logo" alt="logo">
        </div>

        <div class="containerZ"></div>

        <div class="cartaform">
            <ul class="nav nav-tabs" id="authTabs">
                <li class="nav-item">
                    <a class="nav-link active" href="#" onclick="showTab(event, 'login')">Iniciar Sesión</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showTab(event, 'register')">Registrarse</a>
                </li>
            </ul>

            <div id="login" class="tab-content active">
                <h2 class="login-title2">Iniciar Sesión</h2>
                <form id="loginform">
                    <div class="campo-correo-login">
                        <label for="correo" class="forml-label">Correo Electrónico</label>
                        <input class="password" type="email" id="correo" name="correo" placeholder="Ingrese correo electronico" required 
                            oninvalid="this.setCustomValidity('Por favor, escribe un correo válido')" 
                            oninput="this.setCustomValidity('')" >
                    </div>
                    <div class="campo-contraseña-login">
                        <label for="contrasena" class="forml-label">Contraseña</label>
                        <input type="password" class="password" id="contrasena" placeholder="Ingrese contraseña" required
                            oninvalid="this.setCustomValidity('Por favor, escribe una contraseña válida')" 
                            oninput="this.setCustomValidity('')">
                    </div>
                    <button type="submit" class="button1">Ingresar</button>
                  <!-- HU012 -->  <div class="success-message">Inicio Éxitoso</div> <!-- HU012 -->
              <!-- HU018 -->       <a href="#recover" class="forgot-password">¿Olvidaste tu contraseña?</a> <!-- HU018 -->
                </form>
            </div>

            <div id="register" class="tab-content">
                <h2 class="register-title2">Registrarse</h2>
                <form id="registerform">
                    <div class="campo-correo-register">
                        <label for="regcorreo" class="forml-label">Correo Electrónico</label>
                        <input class="password" type="email" id="regcorreo" name="regcorreo" placeholder="Ingrese correo electrónico" required>
                    </div>
                    <div class="campo-contraseña-register">
                        <label for="regcontrasena" class="forml-label">Contraseña</label>
                        <input type="password" class="password" id="regcontrasena" name="regcontrasena" placeholder="Cree una contraseña" required>
                    </div>
                    <button type="submit" class="button1">Registrarse</button>
                  <!-- HU012 -->  <div class="success-message">Registro Exitoso</div> <!-- HU012 -->

                </form>
            </div>
        </div>
    </div>
 <!-- HU018 -->
    <div id="recover" class="modal">
        <div class="modal-content" role="dialog" aria-labelledby="recoverTitle" aria-modal="true">
            <h3 id="recoverTitle" class="modal-title">Recuperar contraseña</h3>
            <p class="modal-text">Por favor, ingrese su dirección de correo electrónico para continuar con la recuperación de su contraseña</p>
            <form class="modal-form">
                <label for="recoverEmail" class="form-label">Correo electrónico</label>
                <input id="recoverEmail" type="email" class="modal-input" placeholder="tucorreo@.com" required>
                <button type="submit" class="modal-button">Enviar enlace</button>
            </form>
     
            <a href="#" class="modal-close" aria-label="Cerrar">x</a> <!-- HU018 -->
        </div>
    </div>
            
        <script src="tabs.js"></script>
</body>
</html>
